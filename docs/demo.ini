; A small public board, used to regenerate docs/screenshots (see tools/retake-screenshots.ps1).
;
; Everything here is a public host or an RFC 5737 documentation address, so nothing about a real
; network ends up in a screenshot. It is safe to run: desktop notifications, the transition log,
; the outage log and trace-on-failure are all off, so it never raises a toast or writes files
; beside itself beyond the usual counters sidecar.

[Settings]
IntervalMs=1000
TimeoutMs=1000
RollingWindow=300
FailuresBeforeDown=3
NotifyOnChange=false
LogEnabled=false
OutageLogEnabled=false
TraceOnFailure=false

; 192.0.2.0/24 (TEST-NET-1) is reserved for documentation and never routes, so this row is
; reliably "not answering" from any network.
[Target:Backup site]
Address=192.0.2.10

[Target:Cloudflare DNS]
Address=1.1.1.1

; HTTPS targets are probed every five seconds rather than every second: they are other people's
; web servers, and a HEAD request per second to each for minutes on end is not polite.
[Target:example.com]
Address=example.com
Probe=https
IntervalMs=5000

[Target:github.com]
Address=github.com
Probe=https
IntervalMs=5000

[Target:Google DNS]
Address=8.8.8.8

; Degraded means "still answering, but slower than you said it should be". The threshold is set
; far below any real expectation, so this row shows the state from any network: a public
; resolver is essentially never under 2 ms away.
[Target:Quad9]
Address=9.9.9.9
DegradedLatencyMs=2

[Target:OpenDNS]
Address=208.67.222.222


[Target:wikipedia.org]
Address=wikipedia.org
Probe=https
IntervalMs=5000